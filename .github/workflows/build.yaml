name: test build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: test build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: npm ci
      - run: npm run build
        env:
          SECRET_API_TOKEN: ${{secrets.SECRET_API_TOKEN}}
          DATOCMS_DRAFT_CONTENT_CDA_TOKEN: ${{secrets.DATOCMS_DRAFT_CONTENT_CDA_TOKEN}}
          DATOCMS_PUBLISHED_CONTENT_CDA_TOKEN: ${{secrets.DATOCMS_PUBLISHED_CONTENT_CDA_TOKEN}}
