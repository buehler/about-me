name: test build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: test build app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run build
        env:
          SECRET_API_TOKEN: ${{secrets.SECRET_API_TOKEN}}
          DATOCMS_DRAFT_CONTENT_CDA_TOKEN: ${{secrets.DATOCMS_DRAFT_CONTENT_CDA_TOKEN}}
          DATOCMS_PUBLISHED_CONTENT_CDA_TOKEN: ${{secrets.DATOCMS_PUBLISHED_CONTENT_CDA_TOKEN}}
